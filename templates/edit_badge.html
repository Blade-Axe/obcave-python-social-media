<!-- templates/edit_badge.html -->
{% extends "base.html" %}
{% block title %}Edit Badge{% endblock %}
{% block content %}
<div id="dashboard-container">
    <div id="dashboard-grid">
        {% include "components/side_panel.html" %}
        <div class="vertical" id="dash-content">
            <div class="admin-panel">
                <h2>Edit Badge: {{ badge.name }}</h2>
                <form method="POST" action="{{ url_for('edit_badge', badge_id=badge.id) }}">
                    <div class="form-group">
                        <label for="name">Badge Name:</label>
                        <input type="text" id="name" name="name" value="{{ badge.name }}" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="description">Description:</label>
                        <textarea id="description" name="description" required>{{ badge.description }}</textarea>
                    </div>
                    
                    <div class="form-group">
                        <label for="permission_level">Permission Level:</label>
                        <select id="permission_level" name="permission_level" required>
                            {% for level in ['cosmetic', 'member', 'obber', 'moderator', 'admin'] %}
                            <option value="{{ level }}" {% if badge.permission_level == level %}selected{% endif %}>
                                {{ level|title }}
                            </option>
                            {% endfor %}
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="order_rank">Order Rank:</label>
                        <input type="number" id="order_rank" name="order_rank" value="{{ badge.order_rank }}" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="icon_path">Icon Path:</label>
                        <input type="text" id="icon_path" name="icon_path" value="{{ badge.icon_path }}" required>
                    </div>
                    
                    <div class="form-group">
                        <label>
                            <input type="checkbox" name="is_dynamic" {% if badge.is_dynamic %}checked{% endif %}>
                            Dynamic Badge
                        </label>
                    </div>
                    
                    <button type="submit" class="btn-primary">Update Badge</button>
                    <a href="{{ url_for('admin_badges') }}" class="btn-secondary">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
