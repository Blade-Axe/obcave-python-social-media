            <path fill="currentColor" d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5s-3 1.34-3 3 1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/>
        </svg>
        ob-census 2025

    {% endif %}
    {% if is_moderator %}
    <h3 class="h3-sidebar">
        Moderation
    </h3>
    <a href="{{ url_for('test') }}" class="{% if request.endpoint == 'test' %}active{% endif %}">
        <svg class="icon" viewBox="0 0 24 24" width="18" height="18">
            <path fill="currentColor" d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-2 12H6v-2h12v2zm0-3H6V9h12v2zm0-3H6V6h12v2z"/>

        Manage Comments

    {% endif %}
    {% if is_admin %}
    <h3 class="h3-sidebar">
        Admin
    </h3>
    <a href="{{ url_for('admin_badges') }}" class="{% if request.endpoint == 'admin_badges' %}active{% endif %}">
        <svg class="icon" viewBox="0 0 24 24" width="18" height="18">
            <path fill="currentColor" d="M20 2H4c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-9 12.5h-2v-7h2v7zm4 0h-2v-7h2v7zm4 0h-2v-7h2v7z"/>
        </svg>
        Manage Badges
    </a>
    <a href="{{ url_for('admin_users') }}" class="{% if request.endpoint == 'admin_users' %}active{% endif %}">
        <svg class="icon" viewBox="0 0 24 24" width="18" height="18">
            <path fill="currentColor" d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm-2 16l-4-4 1.41-1.41L10 14.17l6.59-6.59L18 9l-8 8z"/>
        </svg>
        Manage Users
    </a>
    {% endif %}
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        const icon = entry.target;
                        if (icon.dataset.src) {
                            icon.innerHTML = icon.dataset.src;
                            delete icon.dataset.src;
                        }
                        observer.unobserve(icon);
                    }
                });
            });
        
            // Observe icons that are below the fold
            document.querySelectorAll('.icon:not(:nth-child(-n+5))').forEach(icon => {
                observer.observe(icon);
            });
        });
        </script>
</div>
